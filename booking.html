<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking - VRIDE</title>
    <link rel="icon" type="image/png" href="/icon-512.png">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="tracking-body">
    <div class="app-container">
        <header class="header">
            <button class="back-button" onclick="history.back()"><i class="fa-solid fa-arrow-left"></i></button>
            <h2 class="header-title">Booking Confirmation</h2>
        </header>

        <main class="main-content" style="text-align: center;">
            <div class="booking-status" style="margin: 40px 0;">
                <div class="pulse-icon"
                    style="width: 80px; height: 80px; background: rgba(74, 158, 255, 0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px;">
                    <i class="fa-solid fa-calendar-check" style="font-size: 2rem; color: #4a9eff;"></i>
                </div>
                <h2>Ready to Book?</h2>
                <p style="color: var(--text-secondary); margin-top: 10px;">Your pilot is waiting for confirmation.</p>
            </div>

            <div class="booking-details"
                style="background: rgba(255,255,255,0.05); padding: 20px; border-radius: 16px; text-align: left;">
                <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                    <span>Total Fare</span>
                    <span style="font-weight: 700;">₹<span id="price">0</span></span>
                </div>
                <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                    <span>Estimated Time</span>
                    <span id="eta">5 min</span>
                </div>
                <div
                    style="display: flex; justify-content: space-between; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 10px; margin-top: 5px;">
                    <span>Payment Method</span>
                    <span id="payment-method">Simulation Mode</span>
                </div>
            </div>

            <div style="margin-top: 30px; text-align: left; font-size: 0.85rem; color: var(--text-secondary);">
                <p><i class="fa-solid fa-circle-info"></i> By confirming, you agree to the fare and safety guidelines.
                </p>
            </div>

            <button id="book-now-btn" class="btn btn-primary" style="margin-top: auto; margin-bottom: 30px;">
                Book Now
            </button>
        </main>
    </div>

    <script type="module">
        import { createRide } from './firebase-auth.js';

        document.addEventListener('DOMContentLoaded', () => {
            const entity = JSON.parse(localStorage.getItem('vride_active_entity'));
            const pickup = JSON.parse(localStorage.getItem('vride_pickup'));
            const drop = JSON.parse(localStorage.getItem('vride_drop'));
            const user = JSON.parse(localStorage.getItem('vride_user'));
            const role = localStorage.getItem('vride_role');

            if (!entity) {
                window.location.href = 'home.html';
                return;
            }

            document.getElementById('price').textContent = entity.price;
            document.getElementById('eta').textContent = entity.eta || '5 min';

            document.getElementById('book-now-btn').addEventListener('click', async () => {
                const btn = document.getElementById('book-now-btn');
                btn.disabled = true;
                btn.textContent = 'Processing Booking...';

                // Create a ride record in Firestore
                const rideData = {
                    pickup: pickup,
                    drop: drop,
                    userId: user ? user.uid : 'guest',
                    userName: user ? user.name : 'Guest',
                    entityId: entity.id,
                    entityName: entity.name,
                    price: entity.price,
                    role: role || 'passenger',
                    status: 'requested',
                    payment: {
                        method: 'simulation',
                        status: 'pending',
                        amount: entity.price
                    }
                };

                const rideId = await createRide(rideData);

                if (rideId) {
                    localStorage.setItem('vride_active_ride_id', rideId);
                    window.location.href = 'tracking.html';
                } else {
                    // Fallback if firestore fails
                    console.warn("Using offline mode");
                    window.location.href = 'tracking.html';
                }
            });
        });
    </script>
</body>

</html>
