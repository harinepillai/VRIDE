<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm Your Ride - VRIDE</title>
    <link rel="icon" type="image/png" href="/icon-512.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Razorpay SDK -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script type="module" crossorigin src="/assets/rideConfirmation-BbXz_sRO.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="modulepreload" crossorigin href="/assets/map-utils-ZWOJ9XIw.js">
  <link rel="modulepreload" crossorigin href="/assets/firebase-auth-qvcAOIu8.js">
  <link rel="stylesheet" crossorigin href="/assets/map-utils-CIGW-MKW.css">
  <link rel="stylesheet" crossorigin href="/assets/style-B5gb0Id0.css">
</head>

<body class="tracking-body">
    <div id="confirmation-map" class="tracking-map"></div>

    <!-- Cancel Button (Top Right, below map/header area) -->
    <button class="cancel-ride-top" onclick="cancelSelection()">
        <i class="fa-solid fa-times"></i>
    </button>

    <!-- Bottom Sheet -->
    <div class="driver-card-sheet confirmation-sheet">
        <div class="sheet-handle"></div>

        <div class="active-driver-info">
            <div class="driver-main">
                <div class="avatar-container">
                    <img id="entity-avatar" src="https://ui-avatars.com/api/?name=User&background=random" alt="User">
                    <div class="rating-tag"><i class="fa-solid fa-star"></i> <span id="entity-rating">5.0</span></div>
                </div>
                <div class="driver-text">
                    <h2 id="entity-name">Loading...</h2>
                    <p id="entity-vehicle" style="margin-bottom: 2px; font-size: 0.8rem; color: var(--text-secondary);">
                        Vehicle details</p>
                    <div class="price-row" style="margin: 4px 0;">
                        <span style="font-size: 1.1rem; font-weight: 800; color: var(--vride-gold);">₹<span
                                id="price-val">0</span></span>
                        <p id="car-sharing-note"
                            style="font-size: 0.65rem; color: var(--text-secondary); display: none; margin-top: 2px;">
                            *Price might vary due to the number of co-passengers
                        </p>
                    </div>
                    <div id="eta-info"
                        style="font-size: 0.75rem; color: var(--accent-blue); font-weight: 600; margin-top: 5px;">
                        <i class="fa-solid fa-clock"></i> Arriving in <span id="eta-val">3 min</span>
                    </div>
                </div>
            </div>

            <div class="action-buttons-tracking">
                <button class="action-btn call" onclick="alert('Calling...')"><i class="fa-solid fa-phone"></i></button>
                <button class="action-btn message" onclick="alert('Opening Chat...')"><i
                        class="fa-solid fa-message"></i></button>
            </div>
        </div>

        <div class="confirmation-footer">
            <!-- Payment Selector (Bottom Left) -->
            <div class="payment-selector" id="payment-selector">
                <button class="payment-trigger" onclick="togglePaymentDropdown()">
                    <i class="fa-solid fa-wallet"></i>
                    <span id="selected-payment">Cash</span>
                    <i class="fa-solid fa-chevron-up"></i>
                </button>
                <div class="payment-dropdown" id="payment-dropdown">
                    <div class="payment-option" onclick="selectPayment('UPI', 'fa-mobile-screen')">
                        <i class="fa-solid fa-mobile-screen"></i> <span>UPI</span>
                    </div>
                    <div class="payment-option" onclick="selectPayment('Cash', 'fa-money-bill-1')">
                        <i class="fa-solid fa-money-bill-1"></i> <span>Cash</span>
                    </div>
                    <div class="payment-option" onclick="selectPayment('V-Wallet', 'fa-wallet')">
                        <i class="fa-solid fa-wallet"></i> <span>V-Wallet</span>
                    </div>
                </div>
            </div>

            <!-- Confirm Button (Center/Right) -->
            <button class="confirm-ride-btn" onclick="confirmRide()">
                Confirm Ride
            </button>
        </div>
    </div>


</body>

</html>
