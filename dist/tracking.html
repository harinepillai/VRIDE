<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracking Your Ride - VRIDE</title>
    <link rel="icon" type="image/png" href="/icon-512.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script type="module" crossorigin src="/assets/tracking-BI6Nrv5z.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="modulepreload" crossorigin href="/assets/map-utils-Cm6qByqs.js">
  <link rel="stylesheet" crossorigin href="/assets/map-utils-CIGW-MKW.css">
  <link rel="stylesheet" crossorigin href="/assets/style-DBeyQhMw.css">
</head>

<body class="tracking-body">
    <div id="tracking-map" class="tracking-map"></div>

    <!-- Status Header -->
    <div class="tracking-status-header">
        <div class="status-indicator">
            <div class="pulse"></div>
            <span id="status-text">Driver is arriving</span>
        </div>
        <div class="eta-bubble">
            <span id="eta-value">3 min</span>
            <span class="eta-label">ETA</span>
        </div>
    </div>

    <!-- Driver Card Bottom Sheet -->
    <div class="driver-card-sheet">
        <div class="sheet-handle"></div>

        <div class="active-driver-info">
            <div class="driver-main">
                <div class="avatar-container">
                    <img id="driver-avatar" src="https://ui-avatars.com/api/?name=Driver&background=random"
                        alt="Driver">
                    <div class="rating-tag"><i class="fa-solid fa-star"></i> <span id="driver-rating">5.0</span></div>
                </div>
                <div class="driver-text">
                    <h2 id="driver-name">Loading...</h2>
                    <p id="vehicle-details" style="margin-bottom: 2px;">Vehicle details</p>
                    <div id="occupancy-info"
                        style="font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 8px; display: flex; align-items: center; gap: 5px;">
                        <i class="fa-solid fa-users"></i> <span id="occupancy-text">Loading occupancy...</span>
                    </div>
                    <div class="plate-number">KA 01 MJ 1234</div>
                </div>
            </div>

            <div class="action-buttons-tracking">
                <button class="action-btn call"><i class="fa-solid fa-phone"></i></button>
                <button class="action-btn message"><i class="fa-solid fa-message"></i></button>
            </div>
        </div>

        <div class="trip-stats">
            <div class="stat">
                <span class="stat-label">Distance</span>
                <span id="distance-value" class="stat-value">0.0 km</span>
            </div>
            <div class="stat-divider"></div>
            <div class="stat">
                <span class="stat-label">Price</span>
                <span id="price-value" class="stat-value">₹0</span>
            </div>
        </div>

        <button class="cancel-trip-btn" onclick="cancelTrip()">Cancel Ride</button>
    </div>

</body>

</html>
