<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Let's Get Moving - VRIDE</title>
    <link rel="icon" type="image/png" href="/icon-512.png">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="app-container">
        <header class="header">
            <a href="index.html" class="back-button"><i class="fa-solid fa-arrow-left"></i></a>
        </header>

        <main class="main-content">
            <h1 class="headline">Let's get<br>moving.</h1>
            <p class="subheadline">Verify your number to continue as a Driver.</p>

            <div class="input-group">
                <div class="flag-icon">
                    <img src="https://flagcdn.com/w20/in.png" alt="India Flag">
                    <span class="country-code">+91</span>
                </div>
                <input type="tel" placeholder="(000) 000-0000" class="phone-input">
            </div>

            <button class="btn btn-primary">Send Verification Code</button>

            <div class="divider">
                <span>OR</span>
            </div>

            <button class="btn btn-google">
                <i class="fa-brands fa-google"></i> Continue with Google
            </button>

            <p class="terms">
                By continuing, you accept our<br>
                <a href="#">Terms and Privacy Policy</a>.
            </p>
        </main>

        <footer class="footer-features">
            <div class="feature-item">
                <i class="fa-solid fa-location-crosshairs"></i>
                <span>Live Tracking</span>
            </div>
            <div class="feature-item">
                <i class="fa-solid fa-shield-halved"></i>
                <span>Secure Pay</span>
            </div>
        </footer>
    </div>
    <script type="module" src="script.js"></script>
</body>

</html>
