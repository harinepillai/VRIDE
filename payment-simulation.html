<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Stimulation - VRIDE</title>
    <link rel="icon" type="image/png" href="/icon-512.png">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="tracking-body">
    <div class="app-container">
        <main class="main-content" style="justify-content: center; align-items: center; text-align: center;">
            <div id="payment-processing">
                <div class="spinner" style="width: 60px; height: 60px; border-width: 6px; margin: 0 auto 20px;"></div>
                <h2>Stimulating Payment...</h2>
                <p style="color: var(--text-secondary); margin-top: 10px;">Verifying transaction with your bank</p>
            </div>

            <div id="payment-success" style="display: none;">
                <div class="success-icon"
                    style="width: 100px; height: 100px; background: #2ecc71; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 30px; animation: scaleUp 0.5s ease-out;">
                    <i class="fa-solid fa-check" style="font-size: 3rem; color: #fff;"></i>
                </div>
                <h1 style="font-size: 2rem; margin-bottom: 10px;">Payment Successful!</h1>
                <p style="color: var(--text-secondary); margin-bottom: 30px;">₹<span id="final-amount">0</span> has been
                    paid to your Pilot.</p>

                <div class="transaction-details"
                    style="background: rgba(255,255,255,0.05); padding: 20px; border-radius: 16px; margin-bottom: 40px; text-align: left;">
                    <div
                        style="display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 0.85rem;">
                        <span style="color: var(--text-secondary);">Transaction ID</span>
                        <span id="tx-id" style="font-family: monospace;">VR-482910482</span>
                    </div>
                    <div style="display: flex; justify-content: space-between; font-size: 0.85rem;">
                        <span style="color: var(--text-secondary);">Date & Time</span>
                        <span id="date-time">Today, 10:45 AM</span>
                    </div>
                </div>

                <button onclick="window.location.href='feedback.html'" class="btn btn-primary">
                    Go to Feedback <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>
        </main>
    </div>

    <style>
        @keyframes scaleUp {
            from {
                transform: scale(0);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }
    </style>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const entity = JSON.parse(localStorage.getItem('vride_active_entity'));
            if (entity) {
                document.getElementById('final-amount').textContent = entity.price;
            }

            document.getElementById('tx-id').textContent = 'VR-' + Math.random().toString(36).substr(2, 9).toUpperCase();
            document.getElementById('date-time').textContent = new Date().toLocaleString();

            // Simulate processing time
            setTimeout(() => {
                document.getElementById('payment-processing').style.display = 'none';
                document.getElementById('payment-success').style.display = 'block';
            }, 3000);
        });
    </script>
</body>

</html>
